[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automind"
version = "1.0.0"
description = "AutoMind: a document assistant that answers questions with source citations (RAG)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "numpy>=1.26,<3.0",
  "pypdf>=4.0,<6.0",
  "python-docx>=1.1,<2.0",
  "httpx>=0.27,<1.0",
  "python-pptx>=0.6.23,<2.0",
  "openpyxl>=3.1,<4.0",
  "pillow>=10.1,<13.0",
  "striprtf>=0.0.26,<1.0",
]

[project.optional-dependencies]
# Real embeddings, fast vector search and cross encoder reranking.
ml = [
  "sentence-transformers>=2.7,<4.0",
  "faiss-cpu>=1.8,<2.0",
]
# Reads text from images and scanned PDF pages.
ocr = [
  "rapidocr-onnxruntime>=1.3,<2.0",
  "pypdfium2>=4.30,<6.0",
]
frontend = [
  "streamlit>=1.33,<2.0",
  "requests>=2.31,<3.0",
]
dev = [
  "pytest>=8.0,<10.0",
  "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/automind"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
